name: Release Smoke

on:
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/release.yml'
      - 'packaging/**'
      - 'tools/package_*.ps1'
      - 'tools/package_*.sh'
      - 'release.bat'
      - 'release.sh'
      - 'CMakeLists.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: ubuntu-latest
            platform: linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl ninja-build libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ninja-release

      - name: Build
        run: cmake --build --preset ninja-release

      - name: Package Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/package_release.ps1 -Version 0.0.0 -Platform "${{ matrix.platform }}" -SkipBuild

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          ./tools/package_windows_installer.ps1 -Version 0.0.0 -Platform "${{ matrix.platform }}"

      - name: Validate Windows assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $zip = "dist/gl-draw-desktop-v0.0.0-${{ matrix.platform }}.zip"
          $setup = "dist/gl-draw-desktop-v0.0.0-${{ matrix.platform }}-setup.exe"
          if (-not (Test-Path $zip)) { throw "Missing $zip" }
          if (-not (Test-Path $setup)) { throw "Missing $setup" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $entries = [IO.Compression.ZipFile]::OpenRead($zip).Entries.FullName
          foreach ($required in @(
            "gl-draw-desktop-v0.0.0-${{ matrix.platform }}/bin/gl-draw-desktop.exe",
            "gl-draw-desktop-v0.0.0-${{ matrix.platform }}/share/gldrawdesktop/shaders/basic.vert",
            "gl-draw-desktop-v0.0.0-${{ matrix.platform }}/share/gldrawdesktop/shaders/basic.frag",
            "gl-draw-desktop-v0.0.0-${{ matrix.platform }}/share/gldrawdesktop/themes/oceanic.json",
            "gl-draw-desktop-v0.0.0-${{ matrix.platform }}/share/gldrawdesktop/fonts/NotoSansSC-Regular.ttf"
          )) {
            if ($entries -notcontains $required) { throw "Missing zip entry $required" }
          }

      - name: Package Linux portable
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./tools/package_release.sh --version 0.0.0 --platform "${{ matrix.platform }}" --skip-build

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: bash ./tools/package_appimage.sh --version 0.0.0 --platform "${{ matrix.platform }}"

      - name: Validate Linux assets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tarball="dist/gl-draw-desktop-v0.0.0-${{ matrix.platform }}.tar.gz"
          appimage="dist/gl-draw-desktop-v0.0.0-${{ matrix.platform }}.AppImage"
          test -f "$tarball"
          test -f "$appimage"
          tar -tzf "$tarball" | grep -F "gl-draw-desktop-v0.0.0-${{ matrix.platform }}/bin/gl-draw-desktop"
          tar -tzf "$tarball" | grep -F "share/gldrawdesktop/shaders/basic.vert"
          tar -tzf "$tarball" | grep -F "share/gldrawdesktop/themes/oceanic.json"
          tar -tzf "$tarball" | grep -F "share/gldrawdesktop/fonts/NotoSansSC-Regular.ttf"

      - name: Upload smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-${{ matrix.platform }}
          path: |
            dist/gl-draw-desktop-v0.0.0-*.zip
            dist/gl-draw-desktop-v0.0.0-*.tar.gz
            dist/gl-draw-desktop-v0.0.0-*.exe
            dist/gl-draw-desktop-v0.0.0-*.AppImage
          if-no-files-found: error
