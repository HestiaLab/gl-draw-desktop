name: Static Analysis

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: analysis-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Cache apt packages
        uses: actions/cache@v6
        with:
          path: .cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-v2
          restore-keys: apt-${{ runner.os }}-

      - name: Install tools and dependencies
        run: |
          mkdir -p .cache/apt/archives/partial
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$PWD/.cache/apt/archives" install -y \
            build-essential \
            clang-format \
            clang-tidy \
            cmake \
            cppcheck \
            libgl1-mesa-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            ninja-build \
            yamllint

      - name: YAML lint
        run: yamllint .github .yamllint.yml

      - name: Format check
        # 通过 bash 调用：脚本以 100644 模式提交，不带可执行位。
        run: bash scripts/static_analysis.sh format-check --require-tools

      - name: Cache GLFW source
        id: glfw-cache
        uses: actions/cache@v6
        with:
          path: .cache/glfw
          key: glfw-3.3.9-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Fetch GLFW source on cache miss
        if: steps.glfw-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 3.3.9 https://github.com/glfw/glfw.git .cache/glfw

      - name: Configure clang-tidy database
        run: >
          cmake --preset ninja-debug
          -DFETCHCONTENT_SOURCE_DIR_GLFW="${{ github.workspace }}/.cache/glfw"

      - name: Clang-tidy
        run: bash scripts/static_analysis.sh tidy --require-tools

      - name: Cppcheck
        run: bash scripts/static_analysis.sh cppcheck --require-tools
