name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 3.0.0"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
            artifact: gl-draw-desktop-windows-x64
          - os: ubuntu-latest
            platform: linux-x64
            artifact: gl-draw-desktop-linux-x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          elif [[ "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=""
          fi
          if [ -z "$version" ]; then
            echo "无法解析发布版本。" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl ninja-build libgl1-mesa-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache GLFW source
        id: glfw-cache
        uses: actions/cache@v4
        with:
          path: .cache/glfw
          key: glfw-3.3.9-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Fetch GLFW source on cache miss
        if: steps.glfw-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 3.3.9 https://github.com/glfw/glfw.git .cache/glfw

      - name: Configure release
        run: >
          cmake --preset ninja-release
          -DFETCHCONTENT_SOURCE_DIR_GLFW="${{ github.workspace }}/.cache/glfw"

      - name: Build release
        run: cmake --build --preset ninja-release

      - name: Test release
        run: ctest --preset ninja-release --output-on-failure

      - name: Package Windows portable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/package_release.ps1 -Version "${{ steps.version.outputs.value }}" -Platform "${{ matrix.platform }}" -SkipBuild

      - name: Build Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          ./tools/package_windows_installer.ps1 -Version "${{ steps.version.outputs.value }}" -Platform "${{ matrix.platform }}"

      - name: Package Linux portable
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash ./tools/package_release.sh \
            --version "${{ steps.version.outputs.value }}" \
            --platform "${{ matrix.platform }}" \
            --skip-build

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash ./tools/package_appimage.sh \
            --version "${{ steps.version.outputs.value }}" \
            --platform "${{ matrix.platform }}"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/gl-draw-desktop-v*.zip
            dist/gl-draw-desktop-v*.tar.gz
            dist/gl-draw-desktop-v*.exe
            dist/gl-draw-desktop-v*.AppImage
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="v${{ inputs.version }}"
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.release.outputs.tag }}"
          repo="$GITHUB_REPOSITORY"
          gh release view "$tag" --repo "$repo" >/dev/null 2>&1 || gh release create "$tag" --repo "$repo" --title "$tag" --notes ""
          gh release upload "$tag" dist/gl-draw-desktop-v* --repo "$repo" --clobber
          gh release view "$tag" --repo "$repo" --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
