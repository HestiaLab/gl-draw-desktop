name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        preset: [ninja-debug, ninja-release]
        include:
          - os: ubuntu-latest
            preset: ninja-debug
            compiler: clang
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache apt packages
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: .cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-v2
          restore-keys: apt-${{ runner.os }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          mkdir -p .cache/apt/archives/partial
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$PWD/.cache/apt/archives" install -y \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Clang
        if: matrix.compiler == 'clang'
        run: |
          echo "CC=clang" >> "$GITHUB_ENV"
          echo "CXX=clang++" >> "$GITHUB_ENV"

      - name: Cache GLFW source
        id: glfw-cache
        uses: actions/cache@v6
        with:
          path: .cache/glfw
          key: glfw-3.3.9-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Fetch GLFW source on cache miss
        if: steps.glfw-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 3.3.9 https://github.com/glfw/glfw.git .cache/glfw

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DFETCHCONTENT_SOURCE_DIR_GLFW="${{ github.workspace }}/.cache/glfw"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }} --output-on-failure

  sanitize:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache apt packages
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: .cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-v2
          restore-keys: apt-${{ runner.os }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          mkdir -p .cache/apt/archives/partial
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$PWD/.cache/apt/archives" install -y \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Cache GLFW source
        id: glfw-cache
        uses: actions/cache@v6
        with:
          path: .cache/glfw
          key: glfw-3.3.9-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Fetch GLFW source on cache miss
        if: steps.glfw-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 3.3.9 https://github.com/glfw/glfw.git .cache/glfw

      - name: Configure
        run: >
          cmake --preset ninja-asan
          -DFETCHCONTENT_SOURCE_DIR_GLFW="${{ github.workspace }}/.cache/glfw"

      - name: Build
        run: cmake --build --preset ninja-asan

      - name: Test
        run: ctest --preset ninja-asan --output-on-failure

  coverage:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache apt packages
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: .cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-v2
          restore-keys: apt-${{ runner.os }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          mkdir -p .cache/apt/archives/partial
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$PWD/.cache/apt/archives" install -y \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Cache GLFW source
        id: glfw-cache
        uses: actions/cache@v6
        with:
          path: .cache/glfw
          key: glfw-3.3.9-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Fetch GLFW source on cache miss
        if: steps.glfw-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 3.3.9 https://github.com/glfw/glfw.git .cache/glfw

      - name: Configure
        run: >
          cmake --preset ninja-coverage
          -DFETCHCONTENT_SOURCE_DIR_GLFW="${{ github.workspace }}/.cache/glfw"

      - name: Build
        run: cmake --build --preset ninja-coverage

      - name: Test
        run: ctest --preset ninja-coverage --output-on-failure

  install-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Cache apt packages
        if: runner.os == 'Linux'
        uses: actions/cache@v6
        with:
          path: .cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-v2
          restore-keys: apt-${{ runner.os }}-

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          mkdir -p .cache/apt/archives/partial
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$PWD/.cache/apt/archives" install -y \
            build-essential \
            cmake \
            ninja-build \
            libgl1-mesa-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v6

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache GLFW source
        id: glfw-cache
        uses: actions/cache@v6
        with:
          path: .cache/glfw
          key: glfw-3.3.9-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Fetch GLFW source on cache miss
        if: steps.glfw-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch 3.3.9 https://github.com/glfw/glfw.git .cache/glfw

      - name: Configure release build
        run: >
          cmake --preset ninja-release
          -DFETCHCONTENT_SOURCE_DIR_GLFW="${{ github.workspace }}/.cache/glfw"

      - name: Build release
        run: cmake --build --preset ninja-release

      - name: Install
        run: cmake --install build/ninja-release --config Release --prefix install

      - name: Verify install payload
        shell: bash
        run: |
          set -eu
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f install/bin/gl-draw-desktop.exe
          else
            test -x install/bin/gl-draw-desktop
          fi
          test -f install/share/gldrawdesktop/fonts/NotoSansSC-Regular.ttf
          test -f install/share/gldrawdesktop/fonts/OFL.txt
          test -f install/share/doc/GlDrawDesktop/README.md

      - name: Smoke run version flag
        shell: bash
        run: |
          set -eu
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./install/bin/gl-draw-desktop.exe --version
          else
            ./install/bin/gl-draw-desktop --version
          fi
